name: RaceDay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check RaceDay documentation
      run: |
        test -f README.md
        test -f docs/RaceDay_API_Endpoint_Plan.md
        test -f docs/RaceDay_Data_Model.md
        test -f docs/RaceDay_Database.sql
        test -f docs/RaceDay_ERD.drawio
        test -f docs/RaceDay_ERD.drawio.png
        test -f docs/RaceDay_Planning.md
        echo "RaceDay Part 1 documentation check passed."
